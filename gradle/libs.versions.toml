# Local version catalog. Destined to move to `card-billing-shared/versions/libs.versions.toml`
# and be consumed as a git submodule by all four services - that repo doesn't exist yet, so the
# catalog lives here in the meantime. Keeping it in catalog form now means that move is a
# settings.gradle.kts change, not a build script rewrite.

[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
springdocOpenapi = "3.1.0"
archunit = "1.5.0"
# Spring Boot 4.1's BOM no longer manages Testcontainers versions, so this one is pinned here.
testcontainers = "1.21.4"

[libraries]
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
