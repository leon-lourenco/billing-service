spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://localhost:5434/billing
    username: billing
    password: billing

  jpa:
    open-in-view: false
    hibernate:
      # Schema is generated from the JPA mapping, which is also where the indexes this service
      # depends on are declared. A versioned migration tool is the right answer before anything
      # resembling production - noted as a follow-up rather than pretended away.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # The realm imported by docker-compose. Moves to card-billing-shared once that exists.
          issuer-uri: http://localhost:8180/realms/card-billing

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        invoice.operations: true
    tags:
      application: billing-service
      environment: ${environment:local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

billing:
  seed-demo-data: true

logging:
  level:
    com.cardbilling.billing: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
